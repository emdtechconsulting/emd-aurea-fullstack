# =========================================================
# AUREA - Oracle profile
# =========================================================

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=${AUREA_ORACLE_USERNAME}
spring.datasource.password=${AUREA_ORACLE_PASSWORD}

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# =========================================================
# JPA / HIBERNATE - ORACLE
# =========================================================

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# FLYWAY - ORACLE
# =========================================================
#
# Soporte Oracle mediante:
# org.flywaydb:flyway-database-oracle
#
# Las migraciones Oracle están separadas de las migraciones
# MariaDB y han sido validadas sobre un esquema Oracle vacío.
#
# Flyway permanece desactivado por defecto en este perfil
# para evitar aplicar migraciones automáticamente sobre
# esquemas Oracle existentes. Puede habilitarse explícitamente
# para inicializar o validar un esquema controlado.
#
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration/oracle
