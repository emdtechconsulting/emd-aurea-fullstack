# ==============================
# DATABASE - DEVELOPMENT
# ==============================

spring.datasource.url=${AUREA_DB_URL:jdbc:mariadb://localhost:3307/aurea_java}
spring.datasource.username=${AUREA_DB_USER:aurea_app}
spring.datasource.password=${AUREA_DB_PASSWORD}

# ==============================
# JPA / HIBERNATE - DEVELOPMENT
# ==============================

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# ==============================
# AUREA DEVELOPMENT
# ==============================

aurea.catalog.import.enabled=false
aurea.order.test.enabled=false

# ==============================
# OPENAPI / SWAGGER
# ==============================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ==============================
# FLYWAY - DEVELOPMENT
# ==============================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration