spring.datasource.url=jdbc:h2:mem:aurea_test;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

aurea.catalog.import.enabled=false
aurea.order.test.enabled=false

aurea.jwt.secret=AUREA_TEST_ONLY_SECRET_DO_NOT_USE_IN_PRODUCTION_2026
aurea.jwt.expiration-seconds=3600

# Flyway deshabilitado en pruebas H2
spring.flyway.enabled=false
